title: peterkir
description: >-
  Conference talks and OSGi/Eclipse development resources by Peter Kirschner.
baseurl: ""
url: "https://peterkir.github.io"

remote_theme: just-the-docs/just-the-docs@v0.12.0

plugins:
  - jekyll-remote-theme

color_scheme: nil

search_enabled: true
search_tokenizer_separator: /[\s/]+/

nav_sort: order

back_to_top: true
back_to_top_text: "Back to top"

heading_anchors: true

aux_links:
  "GitHub":
    - "https://github.com/peterkir"
aux_links_new_tab: true

footer_content: "Copyright &copy; 2026 Peter Kirschner. All rights reserved."

sass:
  quiet_deps: true
  silence_deprecations:
    - import
    - global-builtin
    - color-functions

exclude:
  - Gemfile.lock
  - agent.md
  - agents.md
  - vendor/
  - node_modules/
  - 201410_EclipseCon_Europe/
  - "201410_EclipseCon_Europe/presentation/node_modules/"
  - "201410_EclipseCon_Europe/presentation/test/"
  - doc/
